services:
  addon:
    build: .
    restart: unless-stopped
    ports: ["7000:7000"]
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      REFRESH_MINUTES: "60"
    depends_on: [flaresolverr]
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
